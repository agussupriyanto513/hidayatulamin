<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk | Yayasan Hidayatulamin</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="auth.js"></script>
<!-- Pi Network SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
:root {
  --gold:    #c9a84c;
  --gold2:   #e8c97e;
  --emerald: #0e7c5b;
  --em2:     #12a67a;
  --pi:      #7c3aed;
  --ink:     #0d1117;
  --ink2:    #1c2333;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

body {
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
  padding: 20px;
  overflow-x: hidden;
}

/* Background */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 50% at 15% 40%, rgba(201,168,76,.10) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 85% 70%, rgba(14,124,91,.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 10%, rgba(124,58,237,.06) 0%, transparent 60%);
}

/* Grid pattern */
.bg-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Card */
.card {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 24px;
  padding: 40px 36px;
  backdrop-filter: blur(20px);
  animation: fadeUp .6s ease both;
}

@keyframes fadeUp {
  from { opacity:0; transform: translateY(24px); }
  to   { opacity:1; transform: translateY(0); }
}

/* Logo */
.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 28px;
}

.logo-icon {
  width: 72px;
  height: 72px;
  background: linear-gradient(135deg, var(--emerald), #059669);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin-bottom: 16px;
  box-shadow: 0 8px 32px rgba(14,124,91,.35);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%,100% { box-shadow: 0 8px 32px rgba(14,124,91,.35); }
  50%      { box-shadow: 0 8px 48px rgba(14,124,91,.55); }
}

.arabic {
  font-family: 'Amiri', serif;
  font-size: 20px;
  color: var(--gold2);
  direction: rtl;
  margin-bottom: 4px;
  letter-spacing: 1px;
}

.brand-name {
  font-family: 'Amiri', serif;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  line-height: 1.2;
}

.brand-sub {
  font-size: 12px;
  color: rgba(255,255,255,.35);
  text-align: center;
  margin-top: 4px;
  letter-spacing: .5px;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,.08);
}
.divider span {
  font-size: 11px;
  color: rgba(255,255,255,.25);
  letter-spacing: .5px;
  text-transform: uppercase;
}

/* Pi Button */
.btn-pi {
  width: 100%;
  padding: 14px 20px;
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  border: none;
  border-radius: 14px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all .2s ease;
  box-shadow: 0 4px 20px rgba(124,58,237,.35);
  margin-bottom: 12px;
}

.btn-pi:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(124,58,237,.45);
}

.btn-pi:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.btn-pi .pi-logo {
  width: 22px;
  height: 22px;
  background: rgba(255,255,255,.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
}

/* Email login section */
.email-section {
  display: none;
}

.email-section.show {
  display: block;
  animation: fadeUp .3s ease both;
}

.form-group {
  margin-bottom: 14px;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,.5);
  display: block;
  margin-bottom: 6px;
  letter-spacing: .3px;
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  transition: border-color .2s;
  outline: none;
}

.form-input:focus {
  border-color: var(--emerald);
  background: rgba(255,255,255,.08);
}

.form-input::placeholder { color: rgba(255,255,255,.2); }

.btn-email {
  width: 100%;
  padding: 13px 20px;
  background: linear-gradient(135deg, var(--emerald), #059669);
  border: none;
  border-radius: 14px;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s ease;
  box-shadow: 0 4px 16px rgba(14,124,91,.3);
  margin-top: 4px;
}

.btn-email:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(14,124,91,.4);
}

.btn-email:disabled { opacity: .6; cursor: not-allowed; }

/* Toggle email login */
.toggle-email {
  text-align: center;
  margin-top: 16px;
}

.toggle-email button {
  background: none;
  border: none;
  color: rgba(255,255,255,.3);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: color .2s;
  font-family: 'DM Sans', sans-serif;
}

.toggle-email button:hover { color: rgba(255,255,255,.6); }

/* Alert */
.alert {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.5;
}
.alert.show { display: flex; }
.alert.error   { background: rgba(220,38,38,.15); border: 1px solid rgba(220,38,38,.25); color: #fca5a5; }
.alert.success { background: rgba(14,124,91,.15);  border: 1px solid rgba(14,124,91,.25);  color: #6ee7b7; }
.alert.info    { background: rgba(124,58,237,.15); border: 1px solid rgba(124,58,237,.25); color: #c4b5fd; }

/* Loading overlay */
.loader-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13,17,23,.85);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  backdrop-filter: blur(8px);
}
.loader-overlay.show { display: flex; }

.loader-spinner {
  width: 48px;
  height: 48px;
  border: 3px solid rgba(255,255,255,.1);
  border-top-color: var(--emerald);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
  color: rgba(255,255,255,.7);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}

/* Not Pi Browser notice */
.not-pibrowser {
  background: rgba(245,158,11,.08);
  border: 1px solid rgba(245,158,11,.2);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 20px;
  display: none;
}
.not-pibrowser.show { display: block; }
.not-pibrowser p {
  font-size: 12px;
  color: rgba(245,158,11,.8);
  line-height: 1.6;
  text-align: center;
}

/* Footer badges */
.foot-badges {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 24px;
  flex-wrap: wrap;
}
.foot-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .4px;
  text-transform: uppercase;
}
.fb-green  { background: rgba(14,124,91,.15);  color: #34d399; border: 1px solid rgba(14,124,91,.25); }
.fb-purple { background: rgba(124,58,237,.15); color: #a78bfa; border: 1px solid rgba(124,58,237,.25); }
.fb-gold   { background: rgba(201,168,76,.15); color: #fbbf24; border: 1px solid rgba(201,168,76,.25); }
.fb-blue   { background: rgba(37,99,235,.15);  color: #60a5fa; border: 1px solid rgba(37,99,235,.25); }

.spin { animation: spin .8s linear infinite; display: inline-block; }

@media (max-width: 440px) {
  .card { padding: 32px 24px; }
  .brand-name { font-size: 19px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<!-- Loading Overlay -->
<div class="loader-overlay" id="loaderOverlay">
  <div class="loader-spinner"></div>
  <p class="loader-text" id="loaderText">Memverifikasi akun...</p>
</div>

<div class="card">

  <!-- Logo & Brand -->
  <div class="logo-wrap">
    <div class="logo-icon">🕌</div>
    <p class="arabic">الهداية الأمين</p>
    <h1 class="brand-name">Yayasan Hidayatulamin</h1>
    <p class="brand-sub">Pesantren Modern · Pi Network · SGT Token</p>
  </div>

  <!-- Alert -->
  <div class="alert" id="alertBox">
    <i class="fas fa-exclamation-circle" style="margin-top:2px; flex-shrink:0;"></i>
    <span id="alertMsg"></span>
  </div>

  <!-- Not Pi Browser Notice -->
  <div class="not-pibrowser" id="notPiBrowser">
    <p><i class="fas fa-info-circle"></i> Untuk login dengan Pi Network, buka halaman ini melalui <strong>Pi Browser</strong>. Atau gunakan login email di bawah.</p>
  </div>

  <!-- Pi Login Button -->
  <button class="btn-pi" id="piBtn" onclick="doPiLogin()">
    <div class="pi-logo">π</div>
    <span id="piBtnText">Masuk dengan Pi Network</span>
  </button>

  <!-- Divider -->
  <div class="divider"><span>atau</span></div>

  <!-- Email Login Toggle -->
  <div class="toggle-email">
    <button onclick="toggleEmail()" id="toggleEmailBtn">
      <i class="fas fa-envelope" style="margin-right:5px;"></i>Masuk dengan Email
    </button>
  </div>

  <!-- Email Login Section -->
  <div class="email-section" id="emailSection">
    <div style="margin-top:16px;">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="emailInput" class="form-input" placeholder="admin@hidayatulamin.id"
          onkeydown="if(event.key==='Enter') doEmailLogin()">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" id="passInput" class="form-input" placeholder="••••••••"
            style="padding-right:42px;"
            onkeydown="if(event.key==='Enter') doEmailLogin()">
          <button onclick="togglePass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;padding:4px;" id="togglePassBtn">
            <i class="fas fa-eye" id="passEyeIcon"></i>
          </button>
        </div>
      </div>
      <button class="btn-email" id="emailBtn" onclick="doEmailLogin()">
        <i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Masuk
      </button>
    </div>
  </div>

  <!-- Footer Badges -->
  <div class="foot-badges">
    <span class="foot-badge fb-green">Firebase</span>
    <span class="foot-badge fb-purple">Pi Network</span>
    <span class="foot-badge fb-gold">SGT Token</span>
    <span class="foot-badge fb-blue">Testnet</span>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const inPiBrowser = !!window.Pi;
let piReady       = false;
let emailShown    = false;

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  // Tampilkan notice jika bukan Pi Browser
  if (!inPiBrowser) {
    document.getElementById('notPiBrowser').classList.add('show');
    document.getElementById('piBtn').disabled = true;
    document.getElementById('piBtnText').innerHTML = '<i class="fas fa-ban" style="margin-right:6px;"></i>Hanya tersedia di Pi Browser';
  }

  // Cek jika sudah login sebelumnya via Pi (localStorage session)
  checkExistingSession();

  // Init Pi SDK
  initPiSdk();
});

function checkExistingSession() {
  try {
    const raw = localStorage.getItem('piUser');
    if (!raw) return;
    const data = JSON.parse(raw);
    const age = Date.now() - (data.ts || 0);
    // Session valid 8 jam
    if (age < 8 * 60 * 60 * 1000 && data.role && data.uid) {
      showLoader('Melanjutkan sesi sebelumnya...');
      setTimeout(() => redirectByRole(data.role), 800);
    } else {
      localStorage.removeItem('piUser');
    }
  } catch(e) {}
}

function initPiSdk() {
  if (!inPiBrowser) return;
  let attempts = 0;
  const tryInit = () => {
    attempts++;
    try {
      if (typeof window.Pi === 'undefined') throw new Error('Pi not defined');
      window.Pi.init({ version: '2.0', sandbox: true });
      piReady = true;
      console.log('✅ Pi SDK ready (sandbox: true)');
    } catch(e) {
      if (attempts < 10) setTimeout(tryInit, 500);
    }
  };
  tryInit();
}

// ═══════════════════════════════════════════
// PI LOGIN
// ═══════════════════════════════════════════
async function doPiLogin() {
  if (!inPiBrowser) {
    showAlert('error', 'Buka halaman ini di Pi Browser untuk login dengan Pi Network.');
    return;
  }
  if (!piReady) {
    try {
      window.Pi.init({ version: '2.0', sandbox: true });
      piReady = true;
    } catch(e) {
      showAlert('error', 'Pi SDK belum siap. Pastikan kamu membuka halaman ini di Pi Browser.');
      return;
    }
  }

  setBtnLoading('piBtn', 'piBtnText', true, 'Menghubungkan ke Pi...');
  clearAlert();

  try {
    // Authenticate Pi
    showLoader('Memverifikasi akun Pi...');
    const authResult = await window.Pi.authenticate(
      ['username', 'payments', 'wallet_address'],
      handleIncompletePayment
    );

    const { user } = authResult;
    const piUid    = user.uid;
    const piUser   = user.username;

    showLoader('Mencari data akun...');

    // Cari user di Firestore berdasarkan piUid
    let userDoc  = null;
    let userRef  = null;
    let isNewUser = false;

    // Cari berdasarkan uid (field uid = piUid)
    const snap1 = await db.collection('users').doc(piUid).get();
    if (snap1.exists) {
      userDoc = snap1.data();
      userRef = db.collection('users').doc(piUid);
    } else {
      // Fallback: cari berdasarkan piUid field atau piUsername
      const snap2 = await db.collection('users')
        .where('piUid', '==', piUid).limit(1).get();
      if (!snap2.empty) {
        userDoc = snap2.docs[0].data();
        userRef = snap2.docs[0].ref;
      } else {
        const snap3 = await db.collection('users')
          .where('piUsername', '==', piUser).limit(1).get();
        if (!snap3.empty) {
          userDoc = snap3.docs[0].data();
          userRef = snap3.docs[0].ref;
        }
      }
    }

    if (userDoc) {
      // ── User lama ──
      if (userDoc.isActive === false) {
        hideLoader();
        setBtnLoading('piBtn', 'piBtnText', false);
        showAlert('error', 'Akun Anda telah dinonaktifkan. Hubungi administrator.');
        return;
      }

      // Update info terbaru
      await userRef.update({
        piUid,
        piUsername:     piUser,
        wallet_address: user.wallet_address || userDoc.wallet_address || null,
        lastLogin:      firebase.firestore.FieldValue.serverTimestamp(),
      }).catch(() => {});

      const role = userDoc.role || 'santri';
      saveSession(piUid, piUser, role);

      showLoader(`Selamat datang, @${piUser}! Mengalihkan...`);
      setTimeout(() => redirectByRole(role), 1000);

    } else {
      // ── User baru — daftarkan sebagai santri ──
      isNewUser = true;
      showLoader('Membuat akun baru...');

      const newData = {
        uid:            piUid,
        piUid,
        piUsername:     piUser,
        username:       piUser,
        displayName:    piUser,
        nama:           piUser,
        email:          piUser + '@pi.hidayatulamin.id',
        wallet_address: user.wallet_address || null,
        role:           'santri',
        isActive:       true,
        loginMethod:    'pi',
        profileComplete: false,
        createdAt:      firebase.firestore.FieldValue.serverTimestamp(),
        lastLogin:      firebase.firestore.FieldValue.serverTimestamp(),
      };

      await db.collection('users').doc(piUid).set(newData);
      saveSession(piUid, piUser, 'santri');

      showLoader('Akun berhasil dibuat! Mengalihkan...');
      setTimeout(() => redirectByRole('santri'), 1200);
    }

  } catch(err) {
    hideLoader();
    setBtnLoading('piBtn', 'piBtnText', false);
    console.error('Pi login error:', err);
    showAlert('error', err.message || 'Gagal login dengan Pi Network. Coba lagi.');
  }
}

// ═══════════════════════════════════════════
// EMAIL LOGIN
// ═══════════════════════════════════════════
async function doEmailLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const pass  = document.getElementById('passInput').value;

  if (!email || !pass) {
    showAlert('error', 'Email dan password wajib diisi.');
    return;
  }

  setBtnLoading('emailBtn', 'emailBtn', true, 'Masuk...');
  clearAlert();
  showLoader('Memverifikasi akun...');

  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    const snap = await db.collection('users').doc(cred.user.uid).get();

    let role = 'santri';
    if (snap.exists) {
      const data = snap.data();
      if (data.isActive === false) {
        await auth.signOut();
        hideLoader();
        setBtnLoading('emailBtn', 'emailBtn', false, '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Masuk');
        showAlert('error', 'Akun Anda telah dinonaktifkan. Hubungi administrator.');
        return;
      }
      role = data.role || 'santri';
      await db.collection('users').doc(cred.user.uid).update({
        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(() => {});
    }

    showLoader(`Selamat datang! Mengalihkan ke dashboard...`);
    setTimeout(() => redirectByRole(role), 800);

  } catch(err) {
    hideLoader();
    setBtnLoading('emailBtn', 'emailBtn', false, '<i class="fas fa-sign-in-alt" style="margin-right:8px;"></i>Masuk');
    const msgs = {
      'auth/user-not-found':     'Email tidak terdaftar.',
      'auth/wrong-password':     'Password salah.',
      'auth/invalid-email':      'Format email tidak valid.',
      'auth/too-many-requests':  'Terlalu banyak percobaan. Coba lagi nanti.',
      'auth/invalid-credential': 'Email atau password salah.',
    };
    showAlert('error', msgs[err.code] || err.message || 'Login gagal. Coba lagi.');
  }
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const ROLE_DASHBOARD = {
  admin:  'dashboard-admin.html',
  ustadz: 'dashboard-ustadz.html',
  santri: 'dashboard-santri.html',
  wali:   'dashboard-wali.html',
};

function redirectByRole(role) {
  const dest = ROLE_DASHBOARD[role] || 'dashboard-santri.html';
  window.location.href = dest;
}

function saveSession(uid, username, role) {
  localStorage.setItem('piUser', JSON.stringify({
    uid, username, role, ts: Date.now()
  }));
}

async function handleIncompletePayment(payment) {
  console.warn('⚠️ Incomplete payment:', payment.identifier);
  try {
    await fetch('/api/payments/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentId: payment.identifier })
    });
  } catch(e) {}
}

function toggleEmail() {
  emailShown = !emailShown;
  const section = document.getElementById('emailSection');
  const btn     = document.getElementById('toggleEmailBtn');
  if (emailShown) {
    section.classList.add('show');
    btn.innerHTML = '<i class="fas fa-times" style="margin-right:5px;"></i>Sembunyikan';
    setTimeout(() => document.getElementById('emailInput').focus(), 100);
  } else {
    section.classList.remove('show');
    btn.innerHTML = '<i class="fas fa-envelope" style="margin-right:5px;"></i>Masuk dengan Email';
  }
}

function togglePass() {
  const inp  = document.getElementById('passInput');
  const icon = document.getElementById('passEyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

function showAlert(type, msg) {
  const box = document.getElementById('alertBox');
  const txt = document.getElementById('alertMsg');
  box.className = `alert ${type} show`;
  txt.textContent = msg;
}

function clearAlert() {
  document.getElementById('alertBox').className = 'alert';
}

function showLoader(text) {
  document.getElementById('loaderText').textContent = text || 'Memuat...';
  document.getElementById('loaderOverlay').classList.add('show');
}

function hideLoader() {
  document.getElementById('loaderOverlay').classList.remove('show');
}

function setBtnLoading(btnId, textId, loading, text) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (textId === btnId) {
    btn.innerHTML = loading
      ? `<i class="fas fa-spinner spin" style="margin-right:8px;"></i>${text || 'Memuat...'}`
      : (text || btn.innerHTML);
  } else {
    const el = document.getElementById(textId);
    if (el) el.innerHTML = loading
      ? `<i class="fas fa-spinner spin"></i> ${text || 'Memuat...'}`
      : '<i class="fas fa-mobile-alt"></i> Masuk dengan Pi Network';
  }
}
</script>
</body>
</html>
