<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Pesantren Hidayatul Amin</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--hijau:#1a5c3a;--hijau-mid:#2d7a50;--hijau-light:#e8f5ee;--emas:#c9a84c;--emas-light:#fdf6e3;--putih:#fff;--abu:#f7f8f7;--teks:#1a2118;--teks-2:#4a5c47;--teks-3:#8a9e85;--border:#dde8db;--merah:#c0392b;--merah-light:#fdf0ef;--biru:#1a4a8a;--biru-light:#eef3fc;--r:10px;--r-lg:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--abu);color:var(--teks);min-height:100vh}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--hijau);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.splash-ornament{width:110px;height:110px;border:2px solid rgba(201,168,76,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.3)}50%{box-shadow:0 0 0 16px rgba(201,168,76,0)}}
.splash-icon{font-size:44px}
.splash-title{font-family:'Amiri',serif;font-size:28px;color:var(--emas);text-align:center;margin-bottom:6px}
.splash-sub{font-size:13px;color:rgba(255,255,255,.55);text-align:center;margin-bottom:36px}
.login-box{background:rgba(255,255,255,.09);border:1px solid rgba(201,168,76,.22);border-radius:var(--r-lg);padding:26px;width:330px}
.login-box h3{font-size:14px;font-weight:500;color:#fff;margin-bottom:16px;text-align:center}
.fld{margin-bottom:12px}
.fld label{font-size:11px;color:rgba(255,255,255,.55);display:block;margin-bottom:5px}
.fld input,.fld select{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:9px 12px;font-size:13px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;outline:none}
.fld input::placeholder{color:rgba(255,255,255,.3)}
.fld input:focus,.fld select:focus{border-color:rgba(201,168,76,.5)}
.fld select option{background:#1a5c3a;color:#fff}
.btn-login{width:100%;padding:11px;background:var(--emas);border:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--hijau);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px;transition:opacity .2s}
.btn-login:hover{opacity:.85}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-err{font-size:11px;color:#ff9a8a;margin-top:8px;text-align:center;min-height:16px;line-height:1.5}
.login-note{font-size:10px;color:rgba(255,255,255,.3);text-align:center;margin-top:10px}

/* APP */
#app{display:none;height:100vh;overflow:hidden}
#app.on{display:flex;flex-direction:column}
.topnav{background:var(--hijau);padding:0 20px;display:flex;align-items:center;gap:12px;height:54px;flex-shrink:0}
.topnav-logo{font-family:'Amiri',serif;font-size:18px;color:var(--emas);flex:1}
.topnav-logo span{font-size:11px;font-family:'Plus Jakarta Sans',sans-serif;color:rgba(255,255,255,.45);display:block;font-weight:300}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--emas);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--hijau);flex-shrink:0}
.topnav-name{font-size:13px;color:#fff;font-weight:500}
.topnav-role{font-size:10px;color:rgba(255,255,255,.45)}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:5px 10px;font-size:11px;color:#fff;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}

.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:210px;background:var(--putih);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.nav-sec{padding:14px 14px 4px;font-size:10px;font-weight:600;color:var(--teks-3);text-transform:uppercase;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;color:var(--teks-2);cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--hijau-light);color:var(--hijau)}
.nav-item.active{background:var(--hijau-light);color:var(--hijau);border-left-color:var(--hijau);font-weight:500}
.nav-item .ico{width:18px;text-align:center}
.content{flex:1;overflow-y:auto;padding:20px}

/* CARDS */
.card{background:var(--putih);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
.ct{font-size:13px;font-weight:600;color:var(--teks);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--abu);border-radius:var(--r);padding:14px;text-align:center}
.stat-n{font-size:22px;font-weight:600;color:var(--hijau)}
.stat-l{font-size:11px;color:var(--teks-3);margin-top:3px}

/* FORM */
.fg{margin-bottom:12px}
.fg label{font-size:11px;font-weight:500;color:var(--teks-2);display:block;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;font-size:13px;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--putih);color:var(--teks);font-family:'Plus Jakarta Sans',sans-serif;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--hijau-mid)}
.fg textarea{resize:vertical;min-height:64px}

/* BUTTONS */
.btn{font-size:12px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--putih);color:var(--teks);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{background:var(--abu)}
.btn.h{background:var(--hijau);color:#fff;border-color:var(--hijau)}
.btn.h:hover{background:var(--hijau-mid)}
.btn.e{background:var(--emas);color:var(--hijau);border-color:var(--emas);font-weight:600}
.btn.r{background:var(--merah);color:#fff;border-color:var(--merah)}
.btn.sm{font-size:11px;padding:5px 10px}

/* BADGES */
.bd{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:500}
.bh{background:var(--hijau-light);color:var(--hijau)}
.be{background:var(--emas-light);color:#7a5c00}
.br{background:var(--merah-light);color:var(--merah)}
.bb{background:var(--biru-light);color:var(--biru)}
.bg{background:#eee;color:#555}

/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:600;color:var(--teks-3);padding:6px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--teks)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--hijau-light)}

/* NOTIF */
.notif{padding:10px 14px;border-radius:var(--r);margin-bottom:10px;font-size:12px;display:flex;align-items:center;gap:8px}
.nl{background:var(--emas-light);color:#7a5c00;border:1px solid #e8d080}
.no{background:var(--hijau-light);color:var(--hijau);border:1px solid #9fd4b0}
.ne{background:var(--merah-light);color:var(--merah);border:1px solid #f0b0a8}
.ni{background:var(--biru-light);color:var(--biru);border:1px solid #a8c0e8}

/* MISC */
.prog{height:7px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:4px}
.prog-f{height:7px;border-radius:999px;background:var(--hijau-mid)}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--hijau);border-radius:50%;animation:spin .7s linear infinite;margin:48px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sh-t{font-size:15px;font-weight:600;color:var(--teks)}
.sh-s{font-size:12px;color:var(--teks-3);margin-top:2px}
.empty{text-align:center;padding:36px 20px;color:var(--teks-3);font-size:13px}
.ei{font-size:32px;margin-bottom:10px}

/* Pi badge */
.pi-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:999px;background:#f5f0ff;color:#5c35cc;font-weight:600;border:1px solid #d4c4ff}
</style>
</head>
<body>

<!-- SPLASH / LOGIN -->
<div id="splash">
  <div class="splash-ornament"><div class="splash-icon">🕌</div></div>
  <div class="splash-title">Hidayatul Amin</div>
  <div class="splash-sub">Portal Pesantren Terpadu</div>
  <div class="login-box">
    <h3>Masuk ke Portal</h3>
    <div class="fld"><label>Email</label><input type="email" id="li-email" placeholder="email@pesantren.id" autocomplete="email"></div>
    <div class="fld"><label>Password</label><input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <div class="fld"><label>Masuk sebagai</label>
      <select id="li-role">
        <option value="admin">Pimpinan / Admin</option>
        <option value="ustadz">Ustadz / Guru</option>
        <option value="santri">Santri</option>
      </select>
    </div>
    <button class="btn-login" id="btn-li" onclick="doLogin()">Masuk</button>
    <div class="login-err" id="li-err"></div>
    <div class="login-note">Sistem terintegrasi dengan Pi Network Hidayatul Amin</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topnav">
    <div class="topnav-logo">Hidayatul Amin <span>Portal Pesantren Terpadu</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="avatar" id="av">HA</div>
      <div><div class="topnav-name" id="ap-name">—</div><div class="topnav-role" id="ap-role">—</div></div>
      <div id="pi-tag" style="display:none"><span class="pi-badge">π Pi User</span></div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sb"></div>
    <div class="content" id="ct"><div class="spin"></div></div>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut,
  createUserWithEmailAndPassword, signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
  collection, getDocs, query, where, orderBy, limit,
  serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg = {
  apiKey:"AIzaSyCVKeCAJ6_IitpZfu-tF2QaT0esFbbNCAM",
  authDomain:"hidayatulamin-e6f22.firebaseapp.com",
  projectId:"hidayatulamin-e6f22",
  storageBucket:"hidayatulamin-e6f22.firebasestorage.app",
  messagingSenderId:"80743607267",
  appId:"1:80743607267:web:f5f94165de021759958ed6"
};

const app   = initializeApp(cfg);
const auth  = getAuth(app);
const db    = getFirestore(app);

// ── expose ke window ──
window._auth  = auth;
window._db    = db;
window._fns   = { doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
                  collection, getDocs, query, where, orderBy, limit,
                  serverTimestamp, Timestamp, signOut };

// ── helpers ──
const today = () => new Date().toISOString().slice(0,10);
const fmt   = n  => Number(n||0).toLocaleString('id-ID');
const avg   = (...ns) => { const v=ns.filter(x=>x>0); return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):0; };
const mutu  = n  => n>=90?'A':n>=80?'B':n>=70?'C':n>=60?'D':'E';
window._today=today; window._fmt=fmt; window._avg=avg; window._mutu=mutu;

// ──────────────────────────────────────────────
// SEED DATA — hanya jika koleksi santri kosong
// ──────────────────────────────────────────────
async function seedIfEmpty() {
  const {getDocs,collection:col,setDoc,doc:d} = window._fns;
  const snap = await getDocs(col(db,'santri_portal'));
  if (!snap.empty) return;
  const santri = [
    {id:'s001',nama:'Ahmad Fauzi',  kelas:'1A',wali:'Bapak Sunaryo',  hafalan:18,status:'aktif',loginMethod:'email'},
    {id:'s002',nama:'Bilal Mustofa',kelas:'1A',wali:'Ibu Rahmawati', hafalan:12,status:'aktif',loginMethod:'email'},
    {id:'s003',nama:'Dani Hidayat', kelas:'2B',wali:'Bapak Hendra',  hafalan:25,status:'aktif',loginMethod:'email'},
    {id:'s004',nama:'Farid Ansori', kelas:'1A',wali:'Ibu Sulastri',  hafalan:8, status:'aktif',loginMethod:'email'},
    {id:'s005',nama:'Hamzah Latif', kelas:'2B',wali:'Bapak Wahyu',   hafalan:22,status:'aktif',loginMethod:'email'},
  ];
  for(const s of santri) await setDoc(d(db,'santri_portal',s.id),{...s,createdAt:today()});

  // nilai
  const nilaiData = {
    s001:{fiqih:{harian:85,uts:88,uas:90},nahwu:{harian:80,uts:82,uas:84}},
    s002:{fiqih:{harian:75,uts:72,uas:78},nahwu:{harian:70,uts:68,uas:72}},
    s003:{fiqih:{harian:90,uts:92,uas:88},nahwu:{harian:88,uts:90,uas:92}},
    s004:{fiqih:{harian:60,uts:65,uas:70},nahwu:{harian:62,uts:60,uas:65}},
    s005:{fiqih:{harian:88,uts:85,uas:87},nahwu:{harian:85,uts:83,uas:86}},
  };
  for(const [id,n] of Object.entries(nilaiData)) await setDoc(d(db,'nilai_portal',id),{...n,santriId:id,updatedAt:today()});

  // absensi hari ini
  const absDoc = {};
  santri.forEach((s,i)=>{ absDoc[s.id]=i===2?'izin':i===3?'sakit':'hadir'; });
  await setDoc(d(db,'absensi_portal',today()),{tanggal:today(),...absDoc});

  // pengumuman
  await setDoc(d(db,'pengumuman_portal','p001'),{judul:'Libur Idul Adha',isi:'Libur 3 hari mulai 15 Juni 2025.',tgl:today(),penulis:'Pimpinan',createdAt:today()});
  await setDoc(d(db,'pengumuman_portal','p002'),{judul:'Ujian Akhir Semester',isi:'UAS 10–14 Juni 2025.',tgl:today(),penulis:'Tata Usaha',createdAt:today()});

  // keuangan
  await setDoc(d(db,'keuangan_portal','k001'),{jenis:'masuk',ket:'SPP Bulan Mei',nominal:2140000,tgl:today()});
  await setDoc(d(db,'keuangan_portal','k002'),{jenis:'masuk',ket:'Donasi Pembangunan',nominal:5000000,tgl:today()});
  await setDoc(d(db,'keuangan_portal','k003'),{jenis:'keluar',ket:'Listrik & Air',nominal:850000,tgl:today()});
  await setDoc(d(db,'keuangan_portal','k004'),{jenis:'keluar',ket:'Gaji Ustadz',nominal:8500000,tgl:today()});
}

// ──────────────────────────────────────────────
// AUTH — LOGIN
// ──────────────────────────────────────────────
window.doLogin = async function() {
  const email = document.getElementById('li-email').value.trim();
  const pass  = document.getElementById('li-pass').value;
  const role  = document.getElementById('li-role').value;
  const err   = document.getElementById('li-err');
  const btn   = document.getElementById('btn-li');
  err.textContent='';
  if(!email||!pass){err.textContent='Email dan password wajib diisi.';return;}
  btn.disabled=true; btn.textContent='Memproses...';

  try {
    let cred;
    try {
      cred = await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      if(['auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(e.code)) {
        // auto-register user baru
        cred = await createUserWithEmailAndPassword(auth, email, pass);
      } else throw e;
    }

    const uid  = cred.user.uid;
    const nama = email.split('@')[0];

    // cek apakah sudah ada di /users (dari sistem Pi)
    const {doc:d,getDoc,setDoc} = window._fns;
    const userSnap = await getDoc(d(db,'users',uid));

    if(userSnap.exists()) {
      // user Pi — ambil data yang ada, override role jika perlu
      const data = userSnap.data();
      window._cu = { uid, email, role: data.role||role, nama: data.nama||data.piUsername||nama, isPi: data.loginMethod==='pi' };
    } else {
      // user portal baru — simpan ke /users agar kompatibel dengan rules
      await setDoc(d(db,'users',uid),{
        uid, email, role, nama,
        loginMethod:'email',
        isActive:true,
        createdAt:today(),
      },{merge:true});
      window._cu = { uid, email, role, nama, isPi:false };
    }

    await seedIfEmpty();
    showApp();
  } catch(e) {
    let msg = e.message||e.code||'Login gagal';
    if(e.code==='auth/wrong-password') msg='Password salah.';
    if(e.code==='auth/too-many-requests') msg='Terlalu banyak percobaan. Tunggu beberapa menit.';
    if(e.code==='auth/network-request-failed') msg='Tidak ada koneksi internet.';
    err.textContent = msg;
    btn.disabled=false; btn.textContent='Masuk';
  }
};

window.doLogout = async function() {
  try { await signOut(auth); } catch(e){}
  window._cu = null;
  document.getElementById('app').classList.remove('on');
  document.getElementById('app').style.display='none';
  document.getElementById('splash').classList.remove('out');
  document.getElementById('btn-li').disabled=false;
  document.getElementById('btn-li').textContent='Masuk';
};

// ──────────────────────────────────────────────
// SHOW APP
// ──────────────────────────────────────────────
function showApp() {
  document.getElementById('splash').classList.add('out');
  const appEl = document.getElementById('app');
  appEl.style.display='flex'; appEl.classList.add('on');
  const u = window._cu;
  document.getElementById('av').textContent = u.nama.slice(0,2).toUpperCase();
  document.getElementById('ap-name').textContent = u.nama;
  document.getElementById('ap-role').textContent = {admin:'Pimpinan / Admin',ustadz:'Ustadz / Guru',santri:'Santri'}[u.role]||u.role;
  if(u.isPi) document.getElementById('pi-tag').style.display='';
  buildNav(u.role);
  loadPage('dashboard');
}

// ──────────────────────────────────────────────
// NAV
// ──────────────────────────────────────────────
const NAV = {
  admin:[
    {s:'Utama'},{id:'dashboard',i:'📊',l:'Dashboard'},{id:'keuangan',i:'💰',l:'Keuangan'},
    {s:'Akademik'},{id:'santri_list',i:'🧕',l:'Data Santri'},{id:'rekap_absensi',i:'📊',l:'Rekap Absensi'},
    {s:'Kelola'},{id:'pengumuman',i:'📢',l:'Pengumuman'},{id:'donasi',i:'💚',l:'Donasi & Wakaf'},
    {s:'Sistem'},{id:'pengaturan',i:'⚙️',l:'Pengaturan'},{id:'profil',i:'👤',l:'Profil'},
  ],
  ustadz:[
    {s:'Akademik'},{id:'dashboard',i:'📊',l:'Dashboard'},
    {id:'nilai',i:'📝',l:'Input Nilai'},{id:'absensi',i:'✅',l:'Absensi'},
    {id:'hafalan',i:'📖',l:'Setoran Hafalan'},
    {s:'Soal'},{id:'soal',i:'📋',l:'Bank Soal'},{id:'generate_soal',i:'🤖',l:'Generate AI'},
    {s:'Lainnya'},{id:'jadwal',i:'📅',l:'Jadwal'},{id:'pengumuman',i:'📢',l:'Pengumuman'},
    {id:'pesan',i:'💬',l:'Pesan'},{id:'profil',i:'👤',l:'Profil'},
  ],
  santri:[
    {s:'Belajarku'},{id:'dashboard',i:'📊',l:'Dashboard'},
    {id:'nilai_santri',i:'📝',l:'Nilai Saya'},{id:'hafalan_santri',i:'📖',l:'Hafalan Saya'},
    {id:'jadwal',i:'📅',l:'Jadwal'},
    {s:'Lainnya'},{id:'spp',i:'💳',l:'Tagihan SPP'},
    {id:'pesan',i:'💬',l:'Pesan'},{id:'profil',i:'👤',l:'Profil'},
  ],
};

function buildNav(role) {
  const items = NAV[role]||NAV.admin;
  document.getElementById('sb').innerHTML = items.map(it=>
    it.s ? `<div class="nav-sec">${it.s}</div>`
    : `<div class="nav-item" id="nv-${it.id}" onclick="loadPage('${it.id}')"><span class="ico">${it.i}</span>${it.l}</div>`
  ).join('');
}

function setNav(id) {
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById('nv-'+id);
  if(el)el.classList.add('active');
}

// ──────────────────────────────────────────────
// LOAD PAGE ROUTER
// ──────────────────────────────────────────────
window.loadPage = async function(id) {
  setNav(id);
  const el = document.getElementById('ct');
  el.innerHTML='<div class="spin"></div>';
  const role = window._cu?.role||'admin';
  const pages = {
    dashboard, keuangan, santri_list, rekap_absensi, pengumuman, donasi, pengaturan, profil,
    nilai, absensi, hafalan, soal, generate_soal, jadwal, pesan,
    nilai_santri, hafalan_santri, spp, tambah_santri,
  };
  const fn=pages[id];
  if(fn) await fn(el,role);
  else el.innerHTML=`<div class="empty"><div class="ei">🚧</div>Halaman <strong>${id}</strong> sedang disiapkan.</div>`;
};

// HELPERS — Firestore CRUD
// ──────────────────────────────────────────────
async function getCol(col_name) {
  const {getDocs,collection:col} = window._fns;
  const snap = await getDocs(col(db,col_name));
  const res = {};
  snap.forEach(d=>{ res[d.id]=d.data(); });
  return res;
}
async function getDocById(col_name,id) {
  const {getDoc,doc:d}=window._fns;
  const snap=await getDoc(d(db,col_name,id));
  return snap.exists()?snap.data():null;
}
async function saveDoc(col_name,id,data) {
  const {setDoc,doc:d}=window._fns;
  await setDoc(d(db,col_name,id),{...data,updatedAt:today()},{merge:true});
}
async function addNew(col_name,data) {
  const {addDoc,collection:col}=window._fns;
  return await addDoc(col(db,col_name),{...data,createdAt:today()});
}
async function delDoc(col_name,id) {
  const {deleteDoc,doc:d}=window._fns;
  await deleteDoc(d(db,col_name,id));
}

function notifEl(id,type,msg){
  const el=document.getElementById(id);
  if(!el)return;
  const cls={ok:'no',err:'ne',load:'nl',info:'ni'}[type]||'ni';
  el.innerHTML=`<div class="notif ${cls}">${msg}</div>`;
}

        <div class="fg"><label>Mata Pelajaran</label>
          <select id="sel-mp" onchange="renderNT()">${mapels.map(m=>`<option value="${m}">${m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select>
        </div>
        <div class="fg"><label>Kelas</label>
          <select id="sel-kls" onchange="renderNT()">
            <option value="">Semua</option>
            ${[...new Set(Object.values(santriAll).map(s=>s.kelas))].map(k=>`<option value="${k}">${k}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div id="nt-wrap"></div><div id="nf-notif"></div>`;

  window._sL=santriAll; window._nL=nilaiAll;
  window.renderNT=function(){
    const mp=document.getElementById('sel-mp').value;
    const kls=document.getElementById('sel-kls').value;
    const f=Object.entries(santriAll).filter(([,s])=>!kls||s.kelas===kls);
    document.getElementById('nt-wrap').innerHTML=`<div class="card"><div class="ct">📝 Nilai — ${mp.toUpperCase()}</div>
      <div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Harian</th><th>UTS</th><th>UAS</th><th>Rata-rata</th><th>Mutu</th></tr>
      ${f.map(([id,s])=>{const n=(nilaiAll[id]||{})[mp]||{};const a=avg(n.harian,n.uts,n.uas);
        return `<tr><td>${s.nama}</td><td>${s.kelas}</td>
          <td><input type="number" id="nh-${id}" value="${n.harian||''}" min="0" max="100" style="width:56px;font-size:12px;padding:4px;border:1px solid var(--border);border-radius:6px;text-align:center"></td>
          <td><input type="number" id="nu-${id}" value="${n.uts||''}" min="0" max="100" style="width:56px;font-size:12px;padding:4px;border:1px solid var(--border);border-radius:6px;text-align:center"></td>
          <td><input type="number" id="na-${id}" value="${n.uas||''}" min="0" max="100" style="width:56px;font-size:12px;padding:4px;border:1px solid var(--border);border-radius:6px;text-align:center"></td>
          <td><strong>${a||'—'}</strong></td>
          <td><span class="bd ${a>=80?'bh':a>=70?'bb':a>=60?'be':'br'}">${a?mutu(a):'—'}</span></td></tr>`;}).join('')}
      </table></div></div>`;
  };
  renderNT();

  window.simpanNilai=async function(){
    const mp=document.getElementById('sel-mp').value;
    notifEl('nf-notif','load','⏳ Menyimpan ke Firestore...');
    try {
      for(const id of Object.keys(santriAll)){
        const h=document.getElementById(`nh-${id}`);if(!h)continue;
        const cur=(nilaiAll[id]||{});
        cur[mp]={harian:+h.value||0,uts:+document.getElementById(`nu-${id}`).value||0,uas:+document.getElementById(`na-${id}`).value||0};
        cur.santriId=id;
        await saveDoc('nilai_portal',id,cur);
      }
      notifEl('nf-notif','ok','✅ Nilai berhasil disimpan!');
    }catch(e){notifEl('nf-notif','err','❌ '+e.message);}
    setTimeout(()=>{const n=document.getElementById('nf-notif');if(n)n.innerHTML='';},3000);
  };
}

      </div>

}

  window._aiData=[];

    const mp=document.getElementById('ai-mp').value;

      const prompt=`Kamu adalah ustadz berpengalaman di pesantren Indonesia. Buatkan ${jml} soal pilihan ganda untuk mata pelajaran ${mp}, topik: "${topik}", tingkat ${kls}.${ins?' Instruksi: '+ins:''}

Jawab HANYA dengan JSON array valid, tanpa teks lain, tanpa markdown:
[{"pertanyaan":"...","opsi":["A. ...","B. ...","C. ...","D. ..."],"jawaban":"A","pembahasan":"..."}]`;

      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})
      });
      const data=await resp.json();
      let txt=(data.content||[]).map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();

          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">

        </div>`).join('');
      document.getElementById('ai-hasil').style.display='';
      notifEl('ai-notif','ok',`✅ Berhasil generate ${arr.length} soal!`);
    }catch(e){notifEl('ai-notif','err','❌ Gagal: '+e.message);}
    btn.disabled=false; btn.textContent='✨ Generate dengan AI';
  };

  window.simpanSatuAI=async function(i){
    const s=window._aiData[i];
    await addNew('bank_soal',{mapel:s.mapel,tipe:'pg',pertanyaan:s.pertanyaan,opsi:s.opsi,jawaban:s.jawaban,pembahasan:s.pembahasan||'',sumber:'AI'});
    alert('✅ Soal '+(i+1)+' tersimpan!');
  };
  window.simpanSemuaAI=async function(){
    if(!window._aiData.length){alert('Belum ada soal.');return;}
    for(const s of window._aiData) await addNew('bank_soal',{mapel:s.mapel,tipe:'pg',pertanyaan:s.pertanyaan,opsi:s.opsi,jawaban:s.jawaban,pembahasan:s.pembahasan||'',sumber:'AI'});

  };
}

async function profil(el) {
  const u = window._cu;
  el.innerHTML=`
    <div class="sh"><div class="sh-t">Profil Saya</div></div>
    <div class="g2">
      <div class="card" style="text-align:center;padding:28px">
        <div style="width:68px;height:68px;border-radius:50%;background:var(--hijau);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;margin:0 auto 12px">${u.nama.slice(0,2).toUpperCase()}</div>
        <div style="font-size:16px;font-weight:600">${u.nama}</div>
        <div style="font-size:12px;color:var(--teks-3);margin-top:4px">${u.email}</div>
        <div style="margin-top:8px;display:flex;gap:6px;justify-content:center">
          <span class="bd bh">${{admin:'Pimpinan',ustadz:'Ustadz',santri:'Santri'}[u.role]||u.role}</span>
          ${u.isPi?'<span class="pi-badge">π Pi Network</span>':''}
        </div>
      </div>
      <div class="card"><div class="ct">✏️ Edit Profil</div>
        <div class="fg"><label>Nama Tampilan</label><input type="text" id="pr-nm" value="${u.nama}"></div>
        <div class="fg"><label>Email</label><input type="text" value="${u.email}" disabled style="opacity:.6"></div>
        <div class="fg"><label>No. WhatsApp</label><input type="tel" id="pr-wa" placeholder="08xx-xxxx-xxxx"></div>
        ${u.role==='ustadz'?'<div class="fg"><label>Bidang Studi</label><input type="text" id="pr-bd" placeholder="Fiqih, Nahwu..."></div>':''}
        <button class="btn h" onclick="simpanProfil()">💾 Simpan</button>
        <div id="pr-notif" style="margin-top:8px"></div>
      </div>
    </div>`;

  window.simpanProfil = async function() {
    const nm = document.getElementById('pr-nm').value.trim();
    if(!nm){notifEl('pr-notif','err','❌ Nama tidak boleh kosong!');return;}
    notifEl('pr-notif','load','⏳ Menyimpan...');
    try {
      await saveDoc('users', u.uid, {
        nama: nm,
        wa: document.getElementById('pr-wa')?.value||'',
        bidang: document.getElementById('pr-bd')?.value||''
      });
      window._cu.nama = nm;
      document.getElementById('ap-name').textContent = nm;
      document.getElementById('av').textContent = nm.slice(0,2).toUpperCase();
      notifEl('pr-notif','ok','✅ Profil diperbarui!');
    } catch(e){ notifEl('pr-notif','err','❌ '+e.message); }
  };
}

// ── PENGATURAN ──
async function pengaturan(el) {
  el.innerHTML=`
    <div class="sh"><div class="sh-t">Pengaturan Portal</div></div>
    <div class="g2">
      <div class="card"><div class="ct">🏫 Identitas Pesantren</div>
        <div class="fg"><label>Nama Pesantren</label><input type="text" id="st-nm" value="Hidayatul Amin"></div>
        <div class="fg"><label>Alamat</label><textarea id="st-al" rows="2" placeholder="Alamat lengkap"></textarea></div>
        <div class="fg"><label>No. Telepon</label><input type="tel" id="st-tp" placeholder="08xx"></div>
        <div class="fg"><label>Email</label><input type="email" id="st-em" placeholder="info@pesantren.id"></div>
        <button class="btn h" onclick="simpanPengaturan()">💾 Simpan</button>
        <div id="st-notif" style="margin-top:8px"></div>
      </div>
      <div class="card"><div class="ct">🗂️ Data & Export</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
          <button class="btn" style="width:100%;justify-content:center" onclick="exportSantri()">📤 Export Data Santri (CSV)</button>
          <button class="btn" style="width:100%;justify-content:center" onclick="exportNilai()">📤 Export Nilai (CSV)</button>
        </div>
        <div style="padding:12px;background:var(--biru-light);border-radius:var(--r);font-size:12px;color:var(--biru);line-height:1.6">
          <strong>ℹ️ Integrasi Pi Network</strong><br>
          Portal ini terhubung penuh dengan sistem Pi Network Hidayatul Amin. Santri yang login via Pi otomatis muncul di data santri dan saldo SGT mereka tetap aman.
        </div>
        <div style="margin-top:12px;padding:12px;background:var(--hijau-light);border-radius:var(--r);font-size:12px;color:var(--hijau);line-height:1.6">
          <strong>🔒 Keamanan Firestore</strong><br>
          Semua data menggunakan Firestore dengan rules yang sudah dikonfigurasi. Admin & ustadz akses via email login. Santri Pi Network via signInAnonymously.
        </div>
      </div>
    </div>`;

  window.simpanPengaturan = async function() {
    notifEl('st-notif','load','⏳ Menyimpan...');
    try {
      await saveDoc('config','portal',{
        namaPesantren: document.getElementById('st-nm').value,
        alamat: document.getElementById('st-al').value,
        telp: document.getElementById('st-tp').value,
        email: document.getElementById('st-em').value,
      });
      notifEl('st-notif','ok','✅ Pengaturan disimpan!');
    } catch(e){ notifEl('st-notif','err','❌ '+e.message); }
  };

  window.exportSantri = async function() {
    const data = await getCol('santri_portal');
    const rows = [['ID','Nama','Kelas','Wali','Hafalan','Login','Status'],
      ...Object.entries(data).map(([id,s])=>[id,s.nama,s.kelas,s.wali||'',s.hafalan||0,s.loginMethod||'email',s.status||'aktif'])];
    const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download = 'santri-hidayatulamin.csv'; a.click();
  };

  window.exportNilai = async function() {
    const [sData,nData] = await Promise.all([getCol('santri_portal'),getCol('nilai_portal')]);
    const mapels = ['fiqih','nahwu','tafsir','hadis','akhlak'];
    const header = ['ID','Nama',...mapels.flatMap(m=>[m+'_harian',m+'_uts',m+'_uas',m+'_avg'])];
    const rows = [header];
    Object.entries(sData).forEach(([id,s])=>{
      const n = nData[id]||{};
      rows.push([id, s.nama, ...mapels.flatMap(m=>{
        const v = n[m]||{}; const a = avg(v.harian,v.uts,v.uas);
        return [v.harian||0, v.uts||0, v.uas||0, a];
      })]);
    });
    const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download = 'nilai-hidayatulamin.csv'; a.click();
  };
}

async function tambah_santri(el) {
  el.innerHTML=`
    <div class="sh"><div class="sh-t">Tambah Santri Baru</div>
      <button class="btn" onclick="loadPage('santri_list')">← Kembali</button>
    </div>
    <div class="card"><div class="ct">📝 Data Santri</div>
      <div class="g2">
        <div class="fg"><label>Nama Lengkap *</label><input type="text" id="ts-nm" placeholder="Nama sesuai ijazah"></div>
        <div class="fg"><label>Tempat, Tanggal Lahir</label><input type="text" id="ts-ttl" placeholder="Cth: Bandung, 10-03-2012"></div>
        <div class="fg"><label>Kelas *</label>
          <select id="ts-kls"><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option></select>
        </div>
        <div class="fg"><label>Jenis Kelamin</label>
          <select id="ts-jk"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>
        </div>
        <div class="fg"><label>Nama Wali *</label><input type="text" id="ts-wl" placeholder="Nama orang tua / wali"></div>
        <div class="fg"><label>WhatsApp Wali</label><input type="tel" id="ts-wa" placeholder="08xx-xxxx-xxxx"></div>
        <div class="fg"><label>Asal Daerah</label><input type="text" id="ts-asl" placeholder="Kab/Kota, Provinsi"></div>
        <div class="fg"><label>Tanggal Masuk</label><input type="date" id="ts-tgl" value="${today()}"></div>
      </div>
      <div class="fg"><label>Catatan Khusus</label>
        <textarea id="ts-cat" placeholder="Kondisi kesehatan, kebutuhan khusus, dll."></textarea>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn h" onclick="simpanSantri()">💾 Simpan Santri</button>
        <button class="btn" onclick="loadPage('santri_list')">Batal</button>
      </div>
      <div id="ts-notif" style="margin-top:10px"></div>
    </div>`;

  window.simpanSantri = async function() {
    const nm  = document.getElementById('ts-nm').value.trim();
    const wl  = document.getElementById('ts-wl').value.trim();
    if(!nm||!wl){ notifEl('ts-notif','err','❌ Nama dan wali wajib diisi!'); return; }
    notifEl('ts-notif','load','⏳ Menyimpan ke Firestore...');
    try {
      await addNew('santri_portal',{
        nama: nm,
        ttl:  document.getElementById('ts-ttl').value,
        kelas:document.getElementById('ts-kls').value,
        jk:   document.getElementById('ts-jk').value,
        wali: wl,
        wa:   document.getElementById('ts-wa').value,
        asal: document.getElementById('ts-asl').value,
        tglMasuk: document.getElementById('ts-tgl').value,
        catatan:  document.getElementById('ts-cat').value,
        hafalan: 0, status:'aktif', loginMethod:'email',
      });
      notifEl('ts-notif','ok','✅ Santri berhasil ditambahkan!');
      setTimeout(()=>loadPage('santri_list'), 1200);
    } catch(e){ notifEl('ts-notif','err','❌ '+e.message); }
  };
}
