<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yayasan Hidayatulamin — Pesantren Modern</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* Latar belakang animasi */
  .bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(13,184,122,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(45,126,245,0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(139,92,246,0.08) 0%, transparent 50%),
                #0f172a;
  }

  /* Grid pattern */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Card tengah */
  .card {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 48px 52px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    max-width: 420px;
    width: 90%;
    animation: fadeIn .8s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Logo */
  .logo {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #0db87a, #059669);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
    box-shadow: 0 8px 32px rgba(13,184,122,0.35);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(13,184,122,0.35); }
    50%       { box-shadow: 0 8px 48px rgba(13,184,122,0.55); }
  }

  /* Arabic text */
  .arabic {
    font-family: 'Amiri', serif;
    font-size: 22px;
    color: #0db87a;
    letter-spacing: 1px;
    margin-bottom: 6px;
    direction: rtl;
  }

  h1 {
    font-family: 'Amiri', serif;
    font-size: 26px;
    color: #fff;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 36px;
    line-height: 1.6;
  }

  /* Progress bar */
  .progress-wrap {
    background: rgba(255,255,255,0.07);
    border-radius: 100px;
    height: 4px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0db87a, #2d7ef5);
    border-radius: 100px;
    animation: load 2.5s ease forwards;
  }

  @keyframes load {
    0%   { width: 0%; }
    60%  { width: 75%; }
    90%  { width: 92%; }
    100% { width: 100%; }
  }

  .status {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    animation: blink 1s ease-in-out infinite alternate;
  }

  @keyframes blink {
    from { opacity: 0.35; }
    to   { opacity: 0.7; }
  }

  /* Badge bawah */
  .badges {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 28px;
    flex-wrap: wrap;
  }

  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .badge.green  { background: rgba(13,184,122,.15); color: #0db87a; border: 1px solid rgba(13,184,122,.25); }
  .badge.blue   { background: rgba(45,126,245,.15);  color: #60a5fa; border: 1px solid rgba(45,126,245,.25); }
  .badge.purple { background: rgba(139,92,246,.15); color: #a78bfa; border: 1px solid rgba(139,92,246,.25); }
  .badge.amber  { background: rgba(245,158,11,.15); color: #fbbf24; border: 1px solid rgba(245,158,11,.25); }
</style>
<!-- Pi Network SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
  // Init Pi SDK untuk App Studio verification
  if (window.Pi) {
    window.Pi.init({ version: '2.0', sandbox: false });
  }
</script>
</head>
<body>
<div class="bg"></div>

<div class="card">
  <div class="logo">🕌</div>

  <p class="arabic">الهداية الأمين</p>
  <h1>Yayasan Hidayatulamin</h1>
  <p class="subtitle">Pesantren Modern berbasis Thariqat &<br>Teknologi AI · Pi Network · SGT Token</p>

  <div class="progress-wrap">
    <div class="progress-bar"></div>
  </div>
  <p class="status" id="statusTxt">Memuat sistem...</p>

  <div class="badges">
    <span class="badge green">Firebase</span>
    <span class="badge blue">Vercel</span>
    <span class="badge purple">Pi Network</span>
    <span class="badge amber">SGT Token</span>
  </div>
</div>

<script>
  // Cek apakah user sudah login via Firebase
  // Karena Firebase SDK belum dimuat di sini, kita pakai redirect sederhana
  const messages = [
    'Memuat sistem...',
    'Menghubungkan ke Firebase...',
    'Memeriksa sesi login...',
    'Mengalihkan ke halaman masuk...'
  ];

  let i = 0;
  const statusEl = document.getElementById('statusTxt');

  const interval = setInterval(() => {
    i++;
    if (i < messages.length) statusEl.textContent = messages[i];
  }, 600);

  // Redirect ke login setelah animasi selesai
  setTimeout(() => {
    clearInterval(interval);
    window.location.href = 'login.html';
  }, 2600);
</script>
</body>
</html>
